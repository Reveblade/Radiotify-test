<!doctype html>
<html lang="tr">

<head>
  <meta charset="utf-8" />
  <title>Radiotify — Mix Kontrol (Stabil)</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      padding: 24px;
      max-width: 720px;
    }

    h1 {
      margin: 0 0 12px
    }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin: 12px 0
    }

    select,
    button {
      padding: 8px 12px;
      font-size: 15px;
    }

    .muted {
      color: #666
    }

    .ok {
      color: #0a7f2e;
    }
  </style>
</head>

<body>
  <h1>Radiotify — Mix Kontrol</h1>
  <p class="muted">
    Ses <strong>Spotify uygulamasından</strong> (veya Web Player’dan) gelir.<br />
    Bu sayfa sadece <em>uzaktan kontrol</em> eder. (SDK kullanılmıyor → ses kesilmez)
  </p>

  <div class="row">
    <button id="refreshDevices">🔄 Cihazları Listele</button>
    <select id="deviceSelect"></select>
    <button id="chooseDevice">✅ Bu Cihazı Kullan</button>
  </div>

  <div class="row">
    <button id="playMix">🎵 Mix Playlist'i Çal</button>
    <button id="seek30">⏩ 30 Saniye İleri Sar</button>
  </div>

  <pre id="log" class="muted"></pre>

  <script>
    const log = (txt) => document.getElementById('log').textContent = txt

    async function getDevices() {
      const res = await fetch('/devices')
      const j = await res.json()
      const sel = document.getElementById('deviceSelect')
      sel.innerHTML = '';
      (j.devices || []).forEach(d => {
        const opt = document.createElement('option')
        opt.value = d.id
        opt.textContent = `${d.name} — ${d.type}${d.is_active ? " (active)" : ""}`
        sel.appendChild(opt)
      })
      if (!j.devices?.length) log('Hiç cihaz bulunamadı. Spotify uygulamasını açın ve tekrar deneyin.')
      else log(`${j.devices.length} cihaz bulundu.`)
    }

    document.getElementById('refreshDevices').onclick = getDevices

    document.getElementById('chooseDevice').onclick = async () => {
      const id = document.getElementById('deviceSelect').value
      if (!id) return log('Önce bir cihaz seçin.')
      await fetch('/chooseDevice', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ device_id: id })
      })
      log('Cihaz seçildi. Artık Mix’i başlatabilirsiniz.')
    }

    document.getElementById('playMix').onclick = async () => {
      const r = await fetch('/playMix', { method: 'POST' })
      if (r.ok) log('▶️ Mix playlist başlatıldı (ses Spotify’dan geliyor).')
      else log('playMix başarısız. Cihaz seçildi mi? Spotify açık mı?')
    }

    document.getElementById('seek30').onclick = async () => {
      const r = await fetch('/seekForward', { method: 'POST' })
      log(r.ok ? '⏩ 30 saniye ileri sarıldı.' : 'seekForward başarısız.')
    }

    getDevices() // sayfa açılır açılmaz cihazları listele
  </script>
</body>

</html>
